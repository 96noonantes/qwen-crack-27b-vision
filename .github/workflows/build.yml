name: Build and publish llama.cpp server with baked-in CRACK vision model

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  MODEL_URL: https://huggingface.co/dealignai/Qwen3.8-27B-CRACK-GGUF/resolve/main/Qwen3.8-27B-CRACK-Q4_K_M.gguf
  MMPROJ_URL: https://huggingface.co/dealignai/Qwen3.8-27B-CRACK-GGUF/resolve/main/mmproj-Qwen3.8-27B-f16.gguf

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (model baked in)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            MODEL_URL=${{ env.MODEL_URL }}
            MMPROJ_URL=${{ env.MMPROJ_URL }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image size
        run: |
          docker image ls ghcr.io/${{ github.repository }}